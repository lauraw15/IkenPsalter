<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IkenPsalter IIIF Preview</title>
  <link rel="stylesheet" href="https://unpkg.com/mirador@3/dist/css/mirador-combined.css" />
  <style>body { margin: 0; height: 100vh; } #mirador { height: 100vh; }</style>
</head>
<body>
  <div id="mirador"></div>

  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/mirador@3/dist/mirador.min.js"></script>
  <script>
    // Load the local preview manifest. Serve files with a local HTTP server for best results.
    Mirador.viewer({
      id: 'mirador',
      window: {
        allowClose: false
      },
      windows: [
        {
          manifestId: 'preview-manifest.json'
        }
      ]
    });
  </script>
</body>
</html>
